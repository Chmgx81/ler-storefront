name: Bug report
description: Something renders wrong, throws, or behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use the **Security** tab and
        "Report a vulnerability" instead — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, including any error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run dev
        2. Open /shop, set sort to ...
        3. Add two pieces to the bag
        4. See error
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the deployed URL.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development (npm run dev)
        - Local production build (npm run build && npm start)
        - Vercel deployment
        - Other Node host
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.14.0"

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Screenshots, console output or logs. Redact secrets, session cookies,
        order tokens and personal data first.
